name: Corrigir descrições do RBL_Teste

on:
  push:
    paths:
      - '.github/workflows/rbl-repair-test-descriptions.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reparar campos de descrição
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('RBL_Teste.html')
          text = path.read_text(encoding='utf-8')
          placeholder = 'Ex.: Sessão inicial dedicada ao enquadramento do Research Base Learning, à compreensão do problema de investigação e à organização do percurso de trabalho.'
          values = {
              1: 'Sessão inicial dedicada ao enquadramento do Research Base Learning, à compreensão do problema de investigação e à organização do percurso de trabalho.',
              2: 'Sessão dedicada à recolha e análise de evidências, com discussão dos critérios de qualidade das fontes.',
              3: 'Sessão de consolidação do percurso investigativo e comunicação dos principais achados.'
          }

          for n, value in values.items():
              required = ' aria-required="true"' if n == 1 else ''
              req_attr = ' required="required"' if n == 1 else ''
              replacement = f'<textarea{required} id="aula{n}_desc" placeholder="{placeholder}"{req_attr}>{value}</textarea>'
              pattern = rf'<textarea[^>]*id="aula{n}_desc".*?(?=<label>Duração:</label>)'
              text, count = re.subn(pattern, replacement + '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Não foi possível reparar aula{n}_desc')

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/rbl-repair-test-descriptions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RBL_Teste.html .github/workflows/rbl-repair-test-descriptions.yml
          git commit -m "Reparar descrições no RBL_Teste"
          git push origin main
