name: Publicar PBL 19 PDF Docente

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'trigger-pbl19'
    runs-on: ubuntu-latest
    steps:
      - name: Obter main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar PDF Docente completo e por sessão
        shell: bash
        run: |
          set -euo pipefail
          cat .pbl19/normal_00.part .pbl19/normal_01.part .pbl19/normal_02.part .pbl19/normal_03.part > /tmp/PBL19.patch
          patch --batch --forward -p0 < /tmp/PBL19.patch
          sed -e 's/^--- PBL\.html$/--- PBL_Teste.html/' -e 's/^+++ PBL\.html$/+++ PBL_Teste.html/' /tmp/PBL19.patch > /tmp/PBL19_Teste.patch
          patch --batch --forward -p0 < /tmp/PBL19_Teste.patch
          grep -q 'id="pblTeacherPdfModal"' PBL.html
          grep -q 'Todas as sessões — PDF completo' PBL.html
          grep -q 'id="pbl-pdf-espelho-restauro-aprovado-v2"' PBL.html
          grep -q 'id="pblTeacherPdfModal"' PBL_Teste.html
          grep -q 'Todas as sessões — PDF completo' PBL_Teste.html
          grep -q 'id="pbl-pdf-espelho-restauro-aprovado-v2"' PBL_Teste.html
          rm -rf .pbl19

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ('PBL.html','PBL_Teste.html'):
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,re.I|re.S)
              with tempfile.TemporaryDirectory() as td:
                  for i,body in enumerate(scripts):
                      if not body.strip():
                          continue
                      p=Path(td)/f'{i}.js'
                      p.write_text(body,encoding='utf-8')
                      result=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                      if result.returncode:
                          raise SystemExit(f'{name} script {i}: {result.stderr}')
          PY

      - name: Publicar na main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PBL.html PBL_Teste.html .pbl19
          git commit -m "PBL: PDF Docente completo e por sessão"
          git push origin main
