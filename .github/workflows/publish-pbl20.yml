name: Publicar PBL 20 validação mínima da tabela Docente

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'trigger-pbl20'
    runs-on: ubuntu-latest
    steps:
      - name: Obter main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar correção aos dois PBL
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p0 < .pbl20/PBL20.patch
          sed -e 's/^--- PBL\.html$/--- PBL_Teste.html/' -e 's/^+++ PBL\.html$/+++ PBL_Teste.html/' .pbl20/PBL20.patch > /tmp/PBL20_Teste.patch
          patch --batch --forward -p0 < /tmp/PBL20_Teste.patch
          grep -q "decorateTable('docenteTable',\[3,4\])" PBL.html
          grep -q "return tableId==='docenteTable'?\[3,4\]:\[\];" PBL.html
          ! grep -q "É obrigatória pelo menos uma linha completa" PBL.html
          grep -q "decorateTable('docenteTable',\[3,4\])" PBL_Teste.html
          grep -q "return tableId==='docenteTable'?\[3,4\]:\[\];" PBL_Teste.html
          ! grep -q "É obrigatória pelo menos uma linha completa" PBL_Teste.html
          rm -rf .pbl20

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ('PBL.html','PBL_Teste.html'):
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',text,re.I|re.S)
              with tempfile.TemporaryDirectory() as td:
                  for i,body in enumerate(scripts):
                      if not body.strip():
                          continue
                      p=Path(td)/f'{i}.js'
                      p.write_text(body,encoding='utf-8')
                      result=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                      if result.returncode:
                          raise SystemExit(f'{name} script {i}: {result.stderr}')
          PY

      - name: Publicar na main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PBL.html PBL_Teste.html .pbl20
          git commit -m "PBL: apenas perguntas e respostas obrigatórias na tabela Docente"
          git push origin main
