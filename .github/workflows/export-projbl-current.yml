name: Exportar PROJ-BL atual

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar ficheiros oficiais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/projbl-current
          test -f PROJ-BL.html
          test -f PROJ-BL_Teste.html
          cp PROJ-BL.html /tmp/projbl-current/PROJ-BL.html
          cp PROJ-BL_Teste.html /tmp/projbl-current/PROJ-BL_Teste.html
          sha256sum /tmp/projbl-current/*
      - uses: actions/upload-artifact@v4
        with:
          name: projbl-current-official
          path: /tmp/projbl-current
          retention-days: 1
