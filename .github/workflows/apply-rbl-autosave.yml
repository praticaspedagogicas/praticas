name: Aplicar autosave resiliente do RBL

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-rbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validar base e aplicar correções
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object RBL.html)" = "2e1378b8ca62ec772d2ebbc4f7a0dedfcdcd0c6d"
          test "$(git hash-object RBL_Teste.html)" = "e22c69eacef85f368c3f0a4a49433fa58eee821e"

          git fetch origin rbl-autosave-payload-20260730:rbl-autosave-payload-20260730

          : > /tmp/RBL.patch.gz.b64
          for f in .rbl-autosave/RBL.00.part .rbl-autosave/RBL.01.part .rbl-autosave/RBL.02.part .rbl-autosave/RBL.03.part .rbl-autosave/RBL.04.part; do
            git show "rbl-autosave-payload-20260730:$f" >> /tmp/RBL.patch.gz.b64
          done

          : > /tmp/RBL_Teste.patch.gz.b64
          for f in .rbl-autosave/RBL_Teste.00.part .rbl-autosave/RBL_Teste.01.part .rbl-autosave/RBL_Teste.02.part .rbl-autosave/RBL_Teste.03.part .rbl-autosave/RBL_Teste.04.part; do
            git show "rbl-autosave-payload-20260730:$f" >> /tmp/RBL_Teste.patch.gz.b64
          done

          base64 -d /tmp/RBL.patch.gz.b64 | gzip -d > /tmp/RBL.patch
          base64 -d /tmp/RBL_Teste.patch.gz.b64 | gzip -d > /tmp/RBL_Teste.patch

          patch --dry-run --batch --fuzz=0 -p0 < /tmp/RBL.patch
          patch --dry-run --batch --fuzz=0 -p0 < /tmp/RBL_Teste.patch
          patch --batch --fuzz=0 -p0 < /tmp/RBL.patch
          patch --batch --fuzz=0 -p0 < /tmp/RBL_Teste.patch

          echo "60514e8d1a577d1cf366c2c78eaf7eda4838afdccf062ede2b14441313d59622  RBL.html" | sha256sum -c -
          echo "d34c2d1e08b534106b1c95d9a4de8c86927e5320058a9f1f043ddf36b5da7228  RBL_Teste.html" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path

          checks = {
              'RBL.html': 'normal',
              'RBL_Teste.html': 'teste',
          }
          required = [
              'RBL AUTOSAVE RESILIENTE V5 2026-07-30',
              'id="rbl-autosave-resiliente-v5"',
              "guioes_autosave_RBL_v5:",
              "data-rbl-template-mode",
              "RBL_Teste(?:\\([^)]*\\))?\\.html",
              "function setLessonCount(count)",
              "function autoRestore()",
              "window.addEventListener('pagehide'",
              "document.addEventListener('visibilitychange'",
              "saveFromLegacy",
          ]

          for filename, mode in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              missing = [item for item in required if item not in text]
              if missing:
                  raise RuntimeError(f'{filename}: elementos em falta: {missing}')
              if text.count('id="rbl-autosave-resiliente-v5"') != 1:
                  raise RuntimeError(f'{filename}: bloco de autosave duplicado ou ausente')
              marker = f'data-rbl-template-mode="{mode}"'
              if marker not in text:
                  raise RuntimeError(f'{filename}: modo interno incorreto; esperado {marker}')
              if text.count('RBL AUTOSAVE RESILIENTE V5 2026-07-30') < 1:
                  raise RuntimeError(f'{filename}: marcador da correção não confirmado')
          PY

          git diff --check

      - name: Commit e publicação
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-rbl-autosave.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrigir autosave resiliente do RBL [skip ci]"
          git push origin HEAD:main
