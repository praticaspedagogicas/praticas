name: Publicar PBL 18 final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publicar-pbl:
    if: github.event.pull_request.title == 'PUBLICAR PBL 18 AGORA'
    runs-on: ubuntu-latest
    steps:
      - name: Obter branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar e validar patches finais
        shell: bash
        run: |
          set -euo pipefail

          echo 'ba8d3301f01726d3ed6a87210f6b16c19348098054d5d0ccb82a885faf1f2e64  PBL.html' | sha256sum -c -
          echo '610b7d81f8ccdde5439a750bc8db1a6a146eeffd0fec628fc5700278c5b241b0  PBL_Teste.html' | sha256sum -c -

          cat .github/pbl18_zpatch/pbl0* | base64 --decode > /tmp/PBL.zpatch
          cat .github/pbl18_zpatch/test0* | base64 --decode > /tmp/PBL_Teste.zpatch

          echo '248d935db95e51013088f00da9a63dde862c563ebf1ab58ecea8ea544fed079b  /tmp/PBL.zpatch' | sha256sum -c -
          echo 'a51e063dac5e3c57184839cde60a8bb5bc0e98bef2116ae0cc29f392e216a7cd  /tmp/PBL_Teste.zpatch' | sha256sum -c -

          zstd -d --patch-from=PBL.html /tmp/PBL.zpatch -o /tmp/PBL.new.html
          zstd -d --patch-from=PBL_Teste.html /tmp/PBL_Teste.zpatch -o /tmp/PBL_Teste.new.html

          echo '264e096deb0e9fec90587555749c75f123699aeb8137fd5761e8c023582dda92  /tmp/PBL.new.html' | sha256sum -c -
          echo 'a52ef0836450abe4851f239cdc06b4d7a86e9c3e90e97cbdc5c85923e2d3df8f  /tmp/PBL_Teste.new.html' | sha256sum -c -

          cp /tmp/PBL.new.html PBL.html
          cp /tmp/PBL_Teste.new.html PBL_Teste.html

          test "$(git hash-object PBL.html)" = '72d7bd74c28328f5333b217d34f7a5e80543dd63'
          test "$(git hash-object PBL_Teste.html)" = '353be5e60c7bb0eaa8196c85de23fd33faa45b11'

          grep -q 'var VERSION=4;' PBL.html
          grep -q '<datalist id="pblCursosList"></datalist>' PBL.html
          grep -q 'search.disabled=!hasUnit;' PBL.html
          grep -q 'Ex.: Turma 2 / Edição Pós-Laboral' PBL.html

          grep -q 'var VERSION=4;' PBL_Teste.html
          grep -q '<option selected="selected">FCS</option>' PBL_Teste.html
          grep -q 'value="Licenciatura em Psicologia"' PBL_Teste.html
          grep -q 'value="2026/2027"' PBL_Teste.html
          grep -q 'value="Turma 2"' PBL_Teste.html

      - name: Publicar na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          rm -rf .github/pbl18_zpatch
          rm -rf .github/pbl_payload .github/pbl_payload_v2
          rm -f .github/workflows/apply-rbl-courses.yml
          rm -f .github/workflows/publish-pbl18.yml

          git add PBL.html PBL_Teste.html .github
          git commit -m 'Publicar PBL 18 final por UO e autosave [skip ci]'
          git push origin HEAD:main
