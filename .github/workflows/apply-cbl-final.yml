name: Comparar CBL gerado

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-cbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Gerar CBL para comparação
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cbl-cursos-autosave-payload-20260730:cbl-cursos-autosave-payload-20260730
          {
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.00.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.01.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.02.part
          } | tr -d '[:space:]' > /tmp/CBL.patch.gz.b64
          base64 -d /tmp/CBL.patch.gz.b64 | gzip -d > /tmp/CBL.patch
          python3 - <<'PY'
          from pathlib import Path
          patch = Path('/tmp/CBL.patch').read_text(encoding='utf-8')
          marker = '@@ -7093,5 +7601,62 @@'
          before, last = patch.split(marker, 1)
          Path('/tmp/CBL.first17.patch').write_text(before.rstrip() + '\n', encoding='utf-8')
          added = [line[1:] for line in last.splitlines() if line.startswith('+') and not line.startswith('+++')]
          Path('/tmp/CBL.last-addition.html').write_text('\n'.join(added).rstrip() + '\n', encoding='utf-8')
          PY
          patch --batch --fuzz=0 -p0 < /tmp/CBL.first17.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CBL.html')
          text=p.read_text(encoding='utf-8')
          addition=Path('/tmp/CBL.last-addition.html').read_text(encoding='utf-8')
          p.write_text(text.replace('</body>', addition+'</body>'), encoding='utf-8')
          PY
          sha256sum CBL.html
          wc -l -c CBL.html
          mkdir -p /tmp/cbl-generated
          cp CBL.html /tmp/cbl-generated/CBL.html
      - uses: actions/upload-artifact@v4
        with:
          name: cbl-generated-for-compare
          path: /tmp/cbl-generated/CBL.html
          if-no-files-found: error
