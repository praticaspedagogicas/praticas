name: Diagnosticar CBL final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnose-cbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mostrar último hunk do patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cbl-cursos-autosave-payload-20260730:cbl-cursos-autosave-payload-20260730
          {
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.00.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.01.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.02.part
          } | tr -d '[:space:]' > /tmp/CBL.patch.gz.b64
          echo '4069a5b8f6ea9bf376ed1ebde7cd7d5789fb520c98b5ba033e9260c210c516d5  /tmp/CBL.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/CBL.patch.gz.b64 | gzip -d > /tmp/CBL.patch
          echo '=== HUNKS ==='
          grep -n '^@@' /tmp/CBL.patch
          echo '=== ÚLTIMAS 220 LINHAS ==='
          tail -n 220 /tmp/CBL.patch
          exit 1
