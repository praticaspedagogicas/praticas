name: Aplicar CBL final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update-cbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar e validar CBL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object CBL.html)" = "b84409504ff79b49548c4f6ba1a9e98036617104"
          test "$(git hash-object CBL_Teste.html)" = "cf239dbcc714e948c8bd5b3e6a8147d34088dd8e"
          git fetch origin cbl-cursos-autosave-payload-20260730:cbl-cursos-autosave-payload-20260730
          {
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.00.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.01.part
            git show cbl-cursos-autosave-payload-20260730:.cbl-courses/CBL2.02.part
          } | tr -d '[:space:]' > /tmp/CBL.patch.gz.b64
          cat > /tmp/CBL_test_from_normal.patch.gz.b64 <<'CBL_TEST_PATCH'

CBL_TEST_PATCH
          echo '4069a5b8f6ea9bf376ed1ebde7cd7d5789fb520c98b5ba033e9260c210c516d5  /tmp/CBL.patch.gz.b64' | sha256sum -c -
          echo '5a74b7962f648962959592025cacc6e485a3539e908ab6c909a0633e6ced0c37  /tmp/CBL_test_from_normal.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/CBL.patch.gz.b64 | gzip -d > /tmp/CBL.patch
          base64 -d /tmp/CBL_test_from_normal.patch.gz.b64 | gzip -d > /tmp/CBL_test_from_normal.patch
          patch --batch --fuzz=0 -p0 < /tmp/CBL.patch
          cp CBL.html CBL_Teste.html
          patch --batch --fuzz=0 -p0 < /tmp/CBL_test_from_normal.patch
          echo '699fe118fd01ad27123f9b2aec39c88369fd52db1cb6330f674731661e3b88f4  CBL.html' | sha256sum -c -
          echo '3e95246f426544645eca57bb36d548dc336343fa240bfd047508a94fc5ec99b6  CBL_Teste.html' | sha256sum -c -
          grep -Fq 'data-cbl-template-mode="normal"' CBL.html
          grep -Fq 'data-cbl-template-mode="teste"' CBL_Teste.html
          grep -Fq 'guioes_autosave_CBL_v6:' CBL.html
          grep -Fq 'Selecione ou pesquise um curso' CBL.html
          grep -Fq 'Abra a lista para selecionar. Pode também escrever para pesquisar.' CBL.html
          grep -Fq 'id="cbl-course-filter-by-unit-v1"' CBL.html
          grep -Fq 'window.CBL_COURSES_BY_UNIT' CBL.html

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-cbl-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CBL.html CBL_Teste.html .github/workflows/apply-cbl-final.yml
          git commit -m 'Corrigir autosave e cursos do CBL [skip ci]'
          git push origin HEAD:main
