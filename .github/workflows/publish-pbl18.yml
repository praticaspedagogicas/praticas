name: Publicar PBL 18 final

on:
  push:
    paths:
      - '.github/workflows/publish-pbl18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e validar os dois templates
        shell: bash
        run: |
          set -euo pipefail

          test -d .github/pbl_payload
          test -d .github/pbl_payload_v2

          cat .github/pbl_payload/part*.b64 .github/pbl_payload_v2/c* \
            | tr -d '\r\n\t ' > /tmp/pbl18_payload.b64

          base64 --decode /tmp/pbl18_payload.b64 > /tmp/pbl18_payload.xz
          xz --test /tmp/pbl18_payload.xz
          xz --decompress --stdout /tmp/pbl18_payload.xz > /tmp/pbl18_payload.bin

          rm -rf /tmp/pbl18_extract
          mkdir -p /tmp/pbl18_extract

          if unzip -tq /tmp/pbl18_payload.bin >/dev/null 2>&1; then
            unzip -q /tmp/pbl18_payload.bin -d /tmp/pbl18_extract
          elif tar -tf /tmp/pbl18_payload.bin >/dev/null 2>&1; then
            tar -xf /tmp/pbl18_payload.bin -C /tmp/pbl18_extract
          else
            echo 'Formato interno do payload não reconhecido:'
            file /tmp/pbl18_payload.bin
            exit 1
          fi

          while find /tmp/pbl18_extract -type f -name '*.zip' -print -quit | grep -q .; do
            NESTED="$(find /tmp/pbl18_extract -type f -name '*.zip' -print -quit)"
            mkdir -p /tmp/pbl18_nested
            unzip -q "$NESTED" -d /tmp/pbl18_nested
            rm -f "$NESTED"
            cp -R /tmp/pbl18_nested/. /tmp/pbl18_extract/
            rm -rf /tmp/pbl18_nested
          done

          NORMAL="$(find /tmp/pbl18_extract -type f -name 'PBL.html' -print -quit)"
          TESTE="$(find /tmp/pbl18_extract -type f -name 'PBL_Teste.html' -print -quit)"

          test -n "$NORMAL"
          test -n "$TESTE"
          test -s "$NORMAL"
          test -s "$TESTE"

          cp "$NORMAL" PBL.html
          cp "$TESTE" PBL_Teste.html

          grep -q 'var VERSION=4;' PBL.html
          grep -q '<datalist id="pblCursosList"></datalist>' PBL.html
          grep -q 'search.disabled=!hasUnit;' PBL.html
          grep -q 'Ex.: Turma 2 / Edição Pós-Laboral' PBL.html

          grep -q 'var VERSION=4;' PBL_Teste.html
          grep -q '<option selected="selected">FCS</option>' PBL_Teste.html
          grep -q 'value="Licenciatura em Psicologia"' PBL_Teste.html
          grep -q 'value="2026/2027"' PBL_Teste.html
          grep -q 'value="Turma 2"' PBL_Teste.html

      - name: Publicar na branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'praticaspedagogicas'
          git config user.email 'actions@users.noreply.github.com'

          rm -rf .github/pbl_payload .github/pbl_payload_v2
          rm -f .github/workflows/publish-pbl18.yml

          git add PBL.html PBL_Teste.html .github
          git commit -m 'Publicar PBL 18 final por UO e autosave'
          git push origin HEAD:main
