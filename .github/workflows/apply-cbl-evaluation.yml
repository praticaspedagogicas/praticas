name: Aplicar ajustes finais da avaliação CBL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cbl-evaluation.yml'

permissions:
  contents: write

jobs:
  update-cbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar CBL e CBL_Teste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          CSS = '''<style id="cbl-assessment-distribution-spacing-final">
          /* Separação visual entre a ponderação global e a distribuição interna do CBL. */
          body:not(.cbl-exporting) .cbl-assessment-distribution-title{
            display:block !important;
            margin:14px 0 2px 0 !important;
            padding:10px 0 0 0 !important;
            border-top:1px solid #ececec !important;
            color:#333 !important;
            font-size:12.4px !important;
            line-height:1.25 !important;
            font-weight:700 !important;
          }
          body:not(.cbl-exporting) .cbl-assessment-distribution-hint{
            margin:0 0 9px 0 !important;
            color:#777 !important;
            font-size:11px !important;
            line-height:1.3 !important;
            font-weight:400 !important;
          }
          .cbl-print-document .cbl-assessment-distribution-title{
            margin:3px 0 2px 0 !important;
            padding:2px 0 0 0 !important;
            border-top:1px solid #d6d6d6 !important;
            font-size:8px !important;
            line-height:1.12 !important;
            font-weight:800 !important;
          }
          .cbl-print-document .cbl-assessment-distribution-hint{
            display:none !important;
          }
          @media print{
            .cbl-assessment-distribution-title{
              margin:3px 0 2px 0 !important;
              padding:2px 0 0 0 !important;
              border-top:1px solid #d6d6d6 !important;
              font-size:8.2px !important;
              line-height:1.12 !important;
              font-weight:700 !important;
            }
            .cbl-assessment-distribution-hint{
              display:none !important;
            }
          }
          </style>
          '''

          OLD_NORMAL = '''<div class="section">
          <h3>Avaliação</h3>
          <label>Ponderação do CBL na Avaliação Contínua: <span class="cbl-required-mark">*</span></label>
          <input aria-required="true" id="pond_total" inputmode="numeric" max="100" min="0" placeholder="0 a 100" required="required" step="1" type="number"/>
          <label>Ponderação - Documento Escrito:</label>
          <input id="pond_doc" inputmode="numeric" max="100" min="0" placeholder="0 a 100" step="1" type="number"/>
          <label>Ponderação - Apresentação Final:</label>
          <input id="pond_apres" inputmode="numeric" max="100" min="0" placeholder="0 a 100" step="1" type="number"/>
          </div>'''

          NEW_NORMAL = '''<div class="section">
          <h3>Avaliação</h3>
          <label>Ponderação do CBL na Avaliação Contínua (%): <span class="cbl-required-mark">*</span></label>
          <input aria-required="true" id="pond_total" inputmode="numeric" max="100" min="1" placeholder="1 a 100" required="required" step="1" type="number"/>
          <div class="hint">Indique a percentagem que o CBL representa na avaliação contínua.</div>
          <div class="cbl-assessment-distribution-title">Distribuição da avaliação do CBL</div>
          <div class="hint cbl-assessment-distribution-hint">Indique como se distribui a avaliação do CBL. Os dois valores devem totalizar 100%.</div>
          <label>Documento escrito (%):</label>
          <input id="pond_doc" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number"/>
          <label>Apresentação final (%):</label>
          <input id="pond_apres" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number"/>
          </div>'''

          OLD_TEST = '''<div class="section">
          <h3>Avaliação</h3>
          <label>Ponderação do CBL na Avaliação Contínua: <span class="cbl-required-mark">*</span></label>
          <input aria-required="true" id="pond_total" inputmode="numeric" max="100" min="0" placeholder="0 a 100" required="required" step="1" type="number" value="100"/>
          <label>Ponderação - Documento Escrito:</label>
          <input id="pond_doc" inputmode="numeric" max="100" min="0" placeholder="0 a 100" step="1" type="number" value="60"/>
          <label>Ponderação - Apresentação Final:</label>
          <input id="pond_apres" inputmode="numeric" max="100" min="0" placeholder="0 a 100" step="1" type="number" value="40"/>
          </div>'''

          NEW_TEST = '''<div class="section">
          <h3>Avaliação</h3>
          <label>Ponderação do CBL na Avaliação Contínua (%): <span class="cbl-required-mark">*</span></label>
          <input aria-required="true" id="pond_total" inputmode="numeric" max="100" min="1" placeholder="1 a 100" required="required" step="1" type="number" value="40"/>
          <div class="hint">Indique a percentagem que o CBL representa na avaliação contínua.</div>
          <div class="cbl-assessment-distribution-title">Distribuição da avaliação do CBL</div>
          <div class="hint cbl-assessment-distribution-hint">Indique como se distribui a avaliação do CBL. Os dois valores devem totalizar 100%.</div>
          <label>Documento escrito (%):</label>
          <input id="pond_doc" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number" value="40"/>
          <label>Apresentação final (%):</label>
          <input id="pond_apres" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number" value="60"/>
          </div>'''

          COMMON_REPLACEMENTS = [
            ("pdf.text('Documento escrito', m + 3, top + 6.8);", "pdf.text('Documento escrito (%)', m + 3, top + 6.8);"),
            ("pdf.text('Apresentação final', m + 3, top + rowH + 6.8);", "pdf.text('Apresentação final (%)', m + 3, top + rowH + 6.8);"),
            ("pdf.text('Peso total do CBL na avaliação contínua:', m + 3, y + 8.1);", "pdf.text('Ponderação do CBL na avaliação contínua (%):', m + 3, y + 8.1);"),
            ("['Ponderação do CBL na Avaliação Contínua', 'pond_total']", "['Ponderação do CBL na Avaliação Contínua (%)', 'pond_total']"),
            ("validateWeight('pond_doc', 'A ponderação do Documento Escrito')", "validateWeight('pond_doc', 'A percentagem do Documento Escrito')"),
            ("Foi indicada uma ponderação para o Documento Escrito, mas a respetiva entrega não foi descrita.", "Foi indicada uma percentagem para o Documento Escrito, mas a respetiva entrega não foi descrita."),
            ("validateWeight('pond_apres', 'A ponderação da Apresentação Final')", "validateWeight('pond_apres', 'A percentagem da Apresentação Final')"),
            ("Foi indicada uma ponderação para a Apresentação Final, mas a respetiva entrega não foi descrita.", "Foi indicada uma percentagem para a Apresentação Final, mas a respetiva entrega não foi descrita."),
            ("A soma das ponderações das entregas preenchidas deve totalizar 100%.", "A soma das percentagens da distribuição da avaliação do CBL deve totalizar 100%.")
          ]

          def replace_or_confirm(text, old, new, label):
            if old in text:
              return text.replace(old, new, 1)
            if new in text:
              return text
            raise RuntimeError(f'Não foi possível localizar o bloco: {label}')

          def update(path, old_block, new_block):
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            if 'id="cbl-assessment-distribution-spacing-final"' not in text:
              if '</head>' not in text:
                raise RuntimeError(f'Cabeçalho HTML não encontrado em {path}')
              text = text.replace('</head>', CSS + '</head>', 1)
            text = replace_or_confirm(text, old_block, new_block, f'avaliação de {path}')
            for old, new in COMMON_REPLACEMENTS:
              if old in text:
                text = text.replace(old, new)
              elif new not in text:
                raise RuntimeError(f'Expressão não encontrada em {path}: {old}')
            p.write_text(text, encoding='utf-8')

          update('CBL.html', OLD_NORMAL, NEW_NORMAL)
          update('CBL_Teste.html', OLD_TEST, NEW_TEST)

          for path in ('CBL.html', 'CBL_Teste.html'):
            text = Path(path).read_text(encoding='utf-8')
            required = [
              'Ponderação do CBL na Avaliação Contínua (%)',
              'Distribuição da avaliação do CBL',
              'Os dois valores devem totalizar 100%.',
              "pdf.text('Documento escrito (%)'",
              "pdf.text('Apresentação final (%)'",
              'A soma das percentagens da distribuição da avaliação do CBL deve totalizar 100%.'
            ]
            missing = [item for item in required if item not in text]
            if missing:
              raise RuntimeError(f'Verificação falhou em {path}: {missing}')

          test = Path('CBL_Teste.html').read_text(encoding='utf-8')
          for expected in ('id="pond_total" inputmode="numeric" max="100" min="1" placeholder="1 a 100" required="required" step="1" type="number" value="40"',
                           'id="pond_doc" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number" value="40"',
                           'id="pond_apres" inputmode="numeric" max="100" min="1" placeholder="1 a 100" step="1" type="number" value="60"'):
            if expected not in test:
              raise RuntimeError(f'Valor de teste não confirmado: {expected}')
          PY

      - name: Commit e publicação
        shell: bash
        run: |
          rm -f .github/workflows/apply-cbl-evaluation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualizar avaliação CBL [skip ci]"
          git push origin main
