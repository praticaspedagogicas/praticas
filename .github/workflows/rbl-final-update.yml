name: Atualizar templates RBL

on:
  push:
    paths:
      - '.github/workflows/rbl-final-update.yml'

permissions:
  contents: write

jobs:
  update-rbl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar atualização final do RBL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('RBL.html'), Path('RBL_Teste.html')]

          objetivos = 'Indique os objetivos de aprendizagem alinhados com os Conteúdos Programáticos da Ficha de Unidade Curricular (FUC)'
          recursos = 'Ex.: EBSCO Discovery Service (EDS), para pesquisa bibliográfica; Research Rabbit, enquanto ferramenta de IA de apoio à descoberta e exploração de relações entre publicações científicas.'
          tarefas = 'Ex.: Constituir grupos de investigação; analisar o tema de partida; formular perguntas orientadoras; definir fontes académicas iniciais; registar critérios éticos para utilização de inteligência artificial no apoio ao trabalho académico.'
          descricao = 'Ex.: Sessão inicial dedicada ao enquadramento do Research Base Learning, à compreensão do problema de investigação e à organização do percurso de trabalho.'
          docentes = 'Ex.: Ana Luiza Marques; João Silva'

          pdf_height = '''function sessionCardHeight(aula){
              const innerW = usable - 22;
              const taskLines = splitText(show(aula.tarefas), innerW, 7.8, "normal");
              const descLines = splitText(show(aula.descricao), innerW, 7.8, "normal");

              /*
               * A altura deve incluir, além das linhas de texto, o cabeçalho da sessão,
               * os dois subtítulos e uma margem inferior real. A fórmula anterior
               * subestimava esta área fixa e podia deixar a Descrição fora do cartão.
               */
              const fixedContentHeight = 36;
              const lineHeight = 3.65;
              const contentHeight = fixedContentHeight +
                taskLines.length * lineHeight +
                descLines.length * lineHeight;

              return Math.max(58, contentHeight);
            }'''

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text

              # Exemplos/placeholder dos campos existentes.
              text = re.sub(r'placeholder="Indique os objetivos de aprendizagem[^"]*"', f'placeholder="{objetivos}"', text)
              text = re.sub(r'placeholder="(?:Ex\.: )?(?:Indique os recursos necessários|Bases de dados científicas|EBSCO Discovery Service)[^"]*"', f'placeholder="{recursos}"', text)
              text = re.sub(r'placeholder="Ex\.: Prof\.ª Ana Luiza Marques; Prof\. João Silva"', f'placeholder="{docentes}"', text)
              text = re.sub(r'placeholder="Ex\.: Ana Luiza Marques; João Silva"', f'placeholder="{docentes}"', text)
              text = re.sub(r'placeholder="(?:Indique as tarefas[^\"]*|Ex\.: Constituir grupos de investigação[^\"]*)"', f'placeholder="{tarefas}"', text)
              text = re.sub(r'placeholder="(?:Descrição da aula[^\"]*|Ex\.: Sessão inicial dedicada ao enquadramento do Research Base Learning[^\"]*)"', f'placeholder="{descricao}"', text)

              # Conteúdo demonstrativo do teste: manter o exemplo completo de tarefas,
              # encurtar a descrição e deixar apenas EDS + Research Rabbit em recursos.
              if 'data-rbl-template-mode="teste"' in text:
                  text = re.sub(
                      r'(<textarea[^>]*id="recursos"[^>]*>).*?(</textarea>)',
                      r'\1EBSCO Discovery Service (EDS), para pesquisa bibliográfica; Research Rabbit, enquanto ferramenta de IA de apoio à descoberta e exploração de relações entre publicações científicas.\2',
                      text,
                      flags=re.S
                  )
                  text = re.sub(
                      r'Sessão inicial dedicada ao enquadramento do Research Base Learning, à compreensão do problema de investigação e à organização do percurso de trabalho\.[^<]*',
                      'Sessão inicial dedicada ao enquadramento do Research Base Learning, à compreensão do problema de investigação e à organização do percurso de trabalho.',
                      text
                  )

              # Novo curso, na lista visível e nas listas internas de validação.
              if 'Marketing Digital - CTSP' not in text:
                  text = text.replace(
                      '<option value="Marketing Digital"></option>',
                      '<option value="Marketing Digital"></option>\n<option value="Marketing Digital - CTSP"></option>'
                  )
                  text = text.replace(
                      '"Marketing Digital", "Gestão de Negócios Internacionais"',
                      '"Marketing Digital", "Marketing Digital - CTSP", "Gestão de Negócios Internacionais"'
                  )
                  text = text.replace(
                      "'Marketing Digital', 'Gestão de Negócios Internacionais'",
                      "'Marketing Digital', 'Marketing Digital - CTSP', 'Gestão de Negócios Internacionais'"
                  )

              # Correção do cartão das sessões no PDF: altura baseada nas linhas reais.
              pattern = r'function sessionCardHeight\(aula\)\{.*?\n\s*\}'
              if 'function sessionCardHeight(aula)' in text:
                  text = re.sub(pattern, pdf_height, text, count=1, flags=re.S)

              if text == original:
                  print(f'Sem alterações necessárias em {path}')
              else:
                  path.write_text(text, encoding='utf-8')
                  print(f'Atualizado: {path}')
          PY

          # A atualização é descartável; não deixar o workflow no repositório.
          rm -f .github/workflows/rbl-final-update.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RBL.html RBL_Teste.html .github/workflows/rbl-final-update.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a publicar."
            exit 0
          fi
          git commit -m "Atualizar RBL e RBL_Teste"
          git push origin main
